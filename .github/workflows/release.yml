name: Release

# Pushing a tag such as v0.1.0 builds the agent tarballs and the debug APK and attaches them to a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Test (race detector)
        working-directory: agent
        run: |
          go vet ./...
          go test -race ./...
      - name: Linux amd64 and arm64 tarballs with checksums
        run: scripts/release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: agent
          path: release/*

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Installs the Android SDK and accepts its licenses on the runner.
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the APK after the version
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "nodo-${GITHUB_REF_NAME}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: nodo-*-debug.apk

  publish:
    needs: [agent, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: assets/*
